name: CI

on:
  pull_request:
  push:
    # main + each developer's branch: every push to DevArea-Jamshid / DevArea-Ritik is tested before it is merged.
    branches: [main, "DevArea-*"]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a staging deploy; newer pushes to other branches replace older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Docker is available on ubuntu runners, so the testcontainers Postgres tests run here.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build seedoc-api
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: seedoc-api:ci
      - name: Build seedoc-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: seedoc-web:ci

  # Every push to main that passes the checks goes to staging (ROADMAP M0-A9, README §15).
  # Secrets (repository settings → Secrets and variables → Actions):
  #   STAGING_SSH_KEY          private key of the CI deploy key (its public half is in deploy's authorized_keys)
  #   STAGING_SSH_KNOWN_HOSTS  the server's host keys (`ssh-keyscan 2.28.143.32`), so a fake server is refused
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [api, web]
    environment:
      name: staging
      url: https://staging.seedoc.cloud
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_SSH: deploy@2.28.143.32
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Secrets pasted in a browser often carry Windows line breaks, which OpenSSH rejects as "invalid format".
          printf '%s\n' "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Fail early with a clear message; the fingerprint is public and must match the key on the server
          # (`ssh deploy@<server> "grep github-actions-staging ~/.ssh/authorized_keys | ssh-keygen -lf -"`).
          ssh-keygen -lf ~/.ssh/id_ed25519 || { echo "::error::STAGING_SSH_KEY is not a readable private key"; exit 1; }
      - run: bash scripts/deploy-staging.sh
