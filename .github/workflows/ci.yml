name: CI

on:
  pull_request:
  push:
    # main + each developer's branch: every push to DevArea-Jamshid / DevArea-Ritik is tested before it is merged.
    branches: [main, "DevArea-*"]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a staging deploy; newer pushes to other branches replace older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # Docker is available on ubuntu runners, so the testcontainers Postgres tests run here.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web format:check
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  # M0-B7 smoke test (WORK_PLAN H-33) against a throwaway local stack: Postgres + Mailpit in Docker, API and Vite dev
  # server on the runner. All keys and the staff login are random per run and masked in the log.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: docker compose -f infra/docker-compose.yml up -d --wait postgres mailpit
      - run: make install
      - name: Generate .env and the e2e staff login
        run: |
          random_key() { python3 -c "import os, base64; print(base64.b64encode(os.urandom(32)).decode())"; }
          pin_key=$(random_key); totp_key=$(random_key); pepper=$(random_key)
          password=$(python3 -c "import secrets; print(secrets.token_urlsafe(24))")
          totp_secret=$(python3 -c "import os, base64; print(base64.b32encode(os.urandom(20)).decode())")
          for value in "$pin_key" "$totp_key" "$pepper" "$password" "$totp_secret"; do echo "::add-mask::$value"; done
          # The local values of .env.example (not in git); mail goes to Mailpit by default, S3 is not used yet.
          cat > .env <<EOF
          ENVIRONMENT=local
          APP_URL=http://localhost:5173
          APP_HOST=localhost
          DATABASE_URL=postgresql+asyncpg://seedoc_app:seedoc_app@localhost:5433/seedoc
          DATABASE_ADMIN_URL=postgresql+asyncpg://seedoc_admin:seedoc_admin@localhost:5433/seedoc
          DATABASE_OWNER_URL=postgresql+asyncpg://seedoc_owner:seedoc_owner@localhost:5433/seedoc
          S3_ENDPOINT=http://localhost:9000
          S3_REGION=eu-central-1
          S3_BUCKET=seedoc-local
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          PIN_ENCRYPTION_KEY=$pin_key
          TOTP_ENCRYPTION_KEY=$totp_key
          IP_HASH_PEPPER=$pepper
          EOF
          # Read by `make seed ARGS=--e2e-staff` and by playwright.config.ts.
          printf 'E2E_STAFF_EMAIL=%s\nE2E_STAFF_PASSWORD=%s\nE2E_STAFF_TOTP_SECRET=%s\n' \
            e2e-staff@e2e.example.com "$password" "$totp_secret" > apps/web/e2e/.env
      - run: make migrate
      - run: make seed ARGS=--e2e-staff
      - name: Start API and web app
        run: |
          (cd apps/api && nohup uv run uvicorn seedoc.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &)
          nohup pnpm --dir apps/web dev > "$RUNNER_TEMP/web.log" 2>&1 &
          # Through the Vite proxy, so this waits for both.
          for _ in $(seq 1 60); do curl -sf http://localhost:5173/api/v1/health > /dev/null && exit 0; sleep 1; done
          echo "::error::API or web app did not answer within 60 s"; tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"; exit 1
      - run: pnpm --dir apps/web e2e:install --with-deps
      - run: make e2e
      - name: Server logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build seedoc-api
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: seedoc-api:ci
      - name: Build seedoc-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: seedoc-web:ci

  # Every push to main that passes the checks goes to staging (ROADMAP M0-A9, README §15).
  # Secrets (repository settings → Secrets and variables → Actions):
  #   STAGING_SSH_KEY          private key of the CI deploy key (its public half is in deploy's authorized_keys)
  #   STAGING_SSH_KNOWN_HOSTS  the server's host keys (`ssh-keyscan 2.28.143.32`), so a fake server is refused
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [api, web, e2e]
    environment:
      name: staging
      url: https://staging.seedoc.cloud
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      STAGING_SSH: deploy@2.28.143.32
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Secrets pasted in a browser often carry Windows line breaks, which OpenSSH rejects as "invalid format".
          printf '%s\n' "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          # Fail early with a clear message; the fingerprint is public and must match the key on the server
          # (`ssh deploy@<server> "grep github-actions-staging ~/.ssh/authorized_keys | ssh-keygen -lf -"`).
          ssh-keygen -lf ~/.ssh/id_ed25519 || { echo "::error::STAGING_SSH_KEY is not a readable private key"; exit 1; }
      - run: bash scripts/deploy-staging.sh
