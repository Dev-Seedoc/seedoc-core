# Staging stack (ARCHITECTURE §12, ROADMAP M0-A9). Lives in /opt/seedoc on the server next to its .env
# (generated by provision.sh). Images seedoc-api / seedoc-web are built by CI (or scripts/deploy-staging.sh) and
# loaded with `docker load`; nothing is built on the server.
#   docker compose run --rm migrate      → alembic upgrade head (as seedoc_owner)
#   docker compose up -d                 → postgres, s3, api, web (Caddy: TLS, /api proxy, files host)
#   docker compose run --rm s3-init      → bucket + versioning + CORS (idempotent)
# Only Caddy publishes ports (80/443). Postgres, RustFS and the API are reachable inside the compose network only.
name: seedoc

x-api: &api
  image: seedoc-api:staging
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: seedoc
      SEEDOC_OWNER_PASSWORD: ${SEEDOC_OWNER_PASSWORD:?set in .env}
      SEEDOC_APP_PASSWORD: ${SEEDOC_APP_PASSWORD:?set in .env}
      SEEDOC_ADMIN_PASSWORD: ${SEEDOC_ADMIN_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Same roles as local (01-roles.sql), then 02 replaces the local passwords with the ones from .env.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-time init Postgres listens on the socket only, so this stays "unhealthy" until the
      # init scripts (roles + passwords) have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d seedoc"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  migrate:
    <<: *api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]

  api:
    <<: *api
    environment:
      # Only Caddy can reach the API, so trust its X-Forwarded-For: the login throttle needs the real client IP.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Object storage (S3 API), the same server as local (D14). Browsers reach it through Caddy at FILES_HOST, because
  # presigned URLs are signed for that address; the API uses the same address (S3_ENDPOINT).
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_ADDRESS: ":9000"
    volumes:
      - s3-data:/data

  # Idempotent bucket setup, run by every deploy: bucket, versioning, CORS for the web app's origin.
  s3-init:
    image: amazon/aws-cli:latest
    restart: "no"
    profiles: ["init"]
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:?set in .env}
      BUCKET: ${S3_BUCKET:?set in .env}
      APP_ORIGIN: ${APP_URL:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://s3:9000 s3api"
        for i in $$(seq 1 30); do $$s3 list-buckets >/dev/null 2>&1 && break; sleep 1; done
        $$s3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-versioning --bucket "$$BUCKET" --versioning-configuration Status=Enabled
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration \
          "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$APP_ORIGIN\"],\"AllowedMethods\":[\"PUT\",\"GET\"],\"AllowedHeaders\":[\"content-type\"],\"MaxAgeSeconds\":3600}]}"
        echo "bucket $$BUCKET ready"

  web:
    image: seedoc-web:staging
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${APP_HOST:?set in .env}
      FILES_ADDRESS: ${FILES_HOST:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - s3

volumes:
  postgres-data:
  s3-data:
  caddy-data:
  caddy-config:
