# Staging stack (ARCHITECTURE §12, ROADMAP M0-A9). Lives in /opt/seedoc on the server next to its .env
# (generated by provision.sh). Images seedoc-api / seedoc-web are built by CI (or scripts/deploy-staging.sh) and
# loaded with `docker load`; nothing is built on the server.
#   docker compose run --rm migrate      → alembic upgrade head (as seedoc_owner)
#   docker compose up -d                 → postgres, api, web (Caddy: TLS + /api proxy)
# Only Caddy publishes ports (80/443). Postgres and the API are reachable inside the compose network only.
name: seedoc

x-api: &api
  image: seedoc-api:staging
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: seedoc
      SEEDOC_OWNER_PASSWORD: ${SEEDOC_OWNER_PASSWORD:?set in .env}
      SEEDOC_APP_PASSWORD: ${SEEDOC_APP_PASSWORD:?set in .env}
      SEEDOC_ADMIN_PASSWORD: ${SEEDOC_ADMIN_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Same roles as local (01-roles.sql), then 02 replaces the local passwords with the ones from .env.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-time init Postgres listens on the socket only, so this stays "unhealthy" until the
      # init scripts (roles + passwords) have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d seedoc"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  migrate:
    <<: *api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]

  api:
    <<: *api
    environment:
      # Only Caddy can reach the API, so trust its X-Forwarded-For: the login throttle needs the real client IP.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: seedoc-web:staging
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${APP_HOST:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
